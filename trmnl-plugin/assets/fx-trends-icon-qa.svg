<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- QA variant of fx-trends-icon.svg, for the QA clone's directory card so
       it cannot be mistaken for the Recipe Master in the dashboard. Same marks,
       with the trace in amber and a solid amber "QA" badge in the empty corner,
       which stays legible at the 64px the dashboard shows.
       Render the PNG with:
       inkscape fx-trends-icon-qa.svg -w 512 -h 512 -o fx-trends-icon-qa.png -->
  <g transform="translate(17 1) scale(1.05)"><path fill="#111" d="M2 4h10.5v4H6.5v4.2h5.5v4H6.5V24H2zM13.2 4h5l2.9 5.6L24 4h4.4l-5.3 9.6L28.8 24h-5l-3.2-6.2L17.3 24h-4.7l5.7-10.4z"/></g>
