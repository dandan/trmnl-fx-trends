---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: ''
polling_url: https://exchange-rates-trmnl.uezi.workers.dev/rates?pairs={{ pairs | url_encode }}&range={{ range }}&w=200&h=30
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: About this plugin
  description: 'Up to 8 currency pairs, each with a sparkline, latest rate and
    percentage change, over 1 month to 5 years. Daily rates from the European Central
    Bank via <a href="https://frankfurter.dev">Frankfurter</a>, no API key needed.<br/>By
    Daniel Laeng. Source code and issues on GitHub. Version __VERSION__.'
  category: finance
  github_url: https://github.com/dandan/trmnl-fx-trends
- keyname: pairs
  field_type: string
  name: Currency pairs
  description: 'Comma-separated FROM/TO, up to 8, in the order they should appear.
    Smaller layouts show only the first few.'
  help_text: 'Supported: AUD BRL CAD CHF CNY CZK DKK EUR GBP HKD HUF IDR ILS INR ISK
    JPY KRW MXN MYR NOK NZD PHP PLN RON SEK SGD THB TRY USD ZAR'
  placeholder: EUR/USD, GBP/USD, USD/JPY
  default: EUR/USD, GBP/USD, USD/JPY, USD/CHF, AUD/USD, USD/CAD
- keyname: range
  field_type: select
  name: Sparkline range
  description: How far back each sparkline reaches. The change % matches this window.
  help_text: Also names the TREND column, e.g. "1 YEAR TREND".
  options:
  - 1M
  - 3M
  - 6M
  - 1Y
  - 2Y
  - 5Y
  default: 1Y
name: FX Trends
# Shown on the recipe's page in the directory. TRMNL asks for at least 100
# words for the recipe to appear in search. Kept here, like the refresh floor,
# because a push replaces the server's copy and a value typed into the
# dashboard is lost on the next deploy.
recipe_overview: |
  FX Trends shows exchange rates for multiple currencies of your choice. Each
  pair is shown with its latest rate, the percentage change over your chosen
  window, and a sparkline chart, so you can see at a glance whether a currency
  is drifting, spiking or settling.

  Choose up to eight currency pairs from thirty currencies, such as GBP to AUD
  or USD to JPY, and a window from one month to five years. Rates are the
  European Central Bank's daily reference rates, published every working day, so
  the newest figure is usually yesterday's; the footer shows the exact dates
  covered. No account or API key is needed. All four layouts are supported, on
  the original TRMNL and the TRMNL X, in landscape and portrait.
description: Exchange rate sparklines, 1M-5Y
# Minutes; allowed: 15 | 60 | 360 | 720 | 1440. The ECB publishes once per
# working day around 16:00 CET and the Worker caches for an hour, so hourly is
# the fastest that can ever show new data. The floor stops installers picking
# faster; they can still go slower. Set here rather than in the dashboard: a
# push replaces the server's copy with this file, so a floor set there is lost.
refresh_interval: 60
refresh_interval_floor: '60'
