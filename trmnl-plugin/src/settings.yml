---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: ''
polling_url: https://exchange-rates-trmnl.uezi.workers.dev/rates?pairs={{ pairs | url_encode }}&range={{ range }}&w=200&h=30
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: About this plugin
  description: 'Up to 8 currency pairs, each with a sparkline, latest rate and
    percentage change, over 1 month to 5 years. Daily rates from the European Central
    Bank via <a href="https://frankfurter.dev">Frankfurter</a>, no API key needed.<br/>By
    Daniel Laeng &mdash; <a href="https://github.com/dandan/trmnl-fx-trends">source
    code on GitHub</a>.'
  category: finance
- keyname: pairs
  field_type: string
  name: Currency pairs
  description: 'Comma-separated FROM/TO, max 8. Supported: AUD BRL CAD CHF CNY CZK DKK
    EUR GBP HKD HUF IDR ILS INR ISK JPY KRW MXN MYR NOK NZD PHP PLN RON SEK SGD THB
    TRY USD ZAR'
  placeholder: GBP/AUD, EUR/USD, USD/JPY
  default: GBP/AUD, EUR/USD, GBP/USD, USD/JPY, EUR/CHF, GBP/EUR
- keyname: range
  field_type: select
  name: Sparkline range
  description: How far back each sparkline reaches. The change % matches this window.
  options:
  - 1M
  - 3M
  - 6M
  - 1Y
  - 2Y
  - 5Y
  default: 1Y
name: FX Trends
description: Exchange rate sparklines, 1M-5Y
refresh_interval: 3600
