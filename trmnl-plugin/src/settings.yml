---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.6
serverless_language: ''
polling_url: https://exchange-rates-trmnl.uezi.workers.dev/rates?pairs={{ pairs | url_encode }}&range={{ range }}&w=200&h=30
polling_headers: 'Authorization: Bearer YOUR_TOKEN_HERE'
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: pairs
  field_type: string
  name: Currency pairs
  description: 'Comma-separated FROM/TO, max 8. Supported: AUD BRL CAD CHF CNY CZK DKK
    EUR GBP HKD HUF IDR ILS INR ISK JPY KRW MXN MYR NOK NZD PHP PLN RON SEK SGD THB
    TRY USD ZAR'
  placeholder: GBP/AUD, EUR/USD, USD/JPY
  default: GBP/AUD, EUR/USD, GBP/USD, USD/JPY, EUR/CHF, GBP/EUR
- keyname: range
  field_type: select
  name: Sparkline range
  description: How far back each sparkline reaches. The change % matches this window.
  options:
  - 1M
  - 3M
  - 6M
  - 1Y
  - 2Y
  - 5Y
  default: 1Y
name: Exchange Rates - Sparklines
description: Show multiple exchange rate charts
refresh_interval: 3600
