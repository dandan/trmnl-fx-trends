<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Trends layouts</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f0; --fg: #1a1a1a; --dim: #666; --line: #c8c8c4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1c; --fg: #ececec; --dim: #9a9a9a; --line: #444; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 17px; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  p { margin: 6px 0 0; color: var(--dim); max-width: 70ch; }
  label { cursor: pointer; white-space: nowrap; }
  .devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; align-items: start; }
  figure { margin: 0 0 20px; }
  figcaption { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; color: var(--dim); }
  figcaption b { color: var(--fg); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 1.6em; }
  img { display: block; width: 100%; height: auto; border: 1px solid var(--line); }
  .portrait img { width: 60%; }
  .x .portrait img { width: 75%; }
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>FX Trends layouts</h1>
    <p>Every view on every device and orientation, from the sample in <code>.trmnlp.yml</code>.
       Written by <code>trmnl-plugin/screenshots.sh</code>. Select an image to open it at full size.</p>
  </div>
  <label><input type="checkbox" id="dark"> Dark mode screenshots</label>
</header>
<h2>full</h2>
<div class="devices">
  <div class="og">
    <figure class="landscape" id="layout-1"><figcaption><b>1</b> TRMNL OG (1-bit), landscape</figcaption>
      <a href="full/og-landscape-light.png"><img src="full/og-landscape-light.png" alt="Layout 1: full on TRMNL OG (1-bit), landscape" loading="lazy"></a></figure>
    <figure class="portrait" id="layout-2"><figcaption><b>2</b> TRMNL OG (1-bit), portrait</figcaption>
      <a href="full/og-portrait-light.png"><img src="full/og-portrait-light.png" alt="Layout 2: full on TRMNL OG (1-bit), portrait" loading="lazy"></a></figure>
  </div>
  <div class="og">
    <figure class="landscape" id="layout-3"><figcaption><b>3</b> TRMNL OG (2-bit), landscape</figcaption>
      <a href="full/ogv2-landscape-light.png"><img src="full/ogv2-landscape-light.png" alt="Layout 3: full on TRMNL OG (2-bit), landscape" loading="lazy"></a></figure>
    <figure class="portrait" id="layout-4"><figcaption><b>4</b> TRMNL OG (2-bit), portrait</figcaption>
      <a href="full/ogv2-portrait-light.png"><img src="full/ogv2-portrait-light.png" alt="Layout 4: full on TRMNL OG (2-bit), portrait" loading="lazy"></a></figure>
  </div>
  <div class="x">
    <figure class="landscape" id="layout-5"><figcaption><b>5</b> TRMNL X (4-bit), landscape</figcaption>
      <a href="full/x-landscape-light.png"><img src="full/x-landscape-light.png" alt="Layout 5: full on TRMNL X (4-bit), landscape" loading="lazy"></a></figure>
    <figure class="portrait" id="layout-6"><figcaption><b>6</b> TRMNL X (4-bit), portrait</figcaption>
      <a href="full/x-portrait-light.png"><img src="full/x-portrait-light.png" alt="Layout 6: full on TRMNL X (4-bit), portrait" loading="lazy"></a></figure>
  </div>
</div>

</main>
<script>
  document.getElementById("dark").addEventListener("change", (e) => {
    const [from, to] = e.target.checked ? ["-light.png", "-dark.png"] : ["-dark.png", "-light.png"];
    for (const img of document.images) {
      img.src = img.getAttribute("src").replace(from, to);
      img.parentElement.href = img.getAttribute("src");
    }
  });
</script>
</body>
</html>
