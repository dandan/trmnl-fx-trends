name = "exchange-rates-trmnl"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Free-tier workers.dev subdomain; after `wrangler deploy` the endpoint is:
#   https://exchange-rates-trmnl.<your-subdomain>.workers.dev/rates?pairs=...
workers_dev = true

# No bindings. The Worker is stateless — upstream responses are cached at the
# edge via `cf.cacheTtl` on the outbound fetch (see src/source.js), so there is
# no KV, no D1 and no cron. See BUILD_PLAN.md §2.
#
# That includes the TRMNL IP allowlist (src/allowlist.js): it is fetched lazily
# on the request path and memoised in a module global, so it needs neither a KV
# binding to live in nor a [triggers] cron to refresh it.
#
# Secret (NOT stored here) — set it once with:
#   npx wrangler secret put API_TOKEN
# Requests must send:  Authorization: Bearer <that value>
# The upstream is keyless; this guards the Worker's own quota. See §2.1.

[observability]
enabled = true

# QA environment: a second deployment at
#   https://exchange-rates-trmnl-qa.<your-subdomain>.workers.dev
# My device's plugin (the QA clone) polls this one; the published recipe polls
# the top-level Worker. Everything but the name is inherited from above, and
# the name is what sets the URL. See docs/build_multi_deploy.md.
#   ./deploy.sh qa    ->  wrangler deploy --env qa
#   ./deploy.sh prod  ->  wrangler deploy
[env.qa]
name = "exchange-rates-trmnl-qa"

# Stamped into every /rates response as `env`, which the plugin prints in its
# title bar ("Exchange Rates (QA)"). Production sets nothing, so the field is
# absent there and the title is bare. Seeing the suffix on the panel is the
# proof that the device's request reached this Worker and not production.
[env.qa.vars]
DEPLOY_ENV = "qa"
